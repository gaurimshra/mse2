spring.application.name=student-skill-management

# Update YOUR_MYSQL_PASSWORD to the password configured for your local MySQL root user.
spring.datasource.url=jdbc:mysql://localhost:3306/student_skill_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA creates/updates the tables based on the Student entity.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
